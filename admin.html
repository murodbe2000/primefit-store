<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#18251e"><title>PrimeFit — Admin</title>
<style>
:root{--bg:#f1f0e9;--card:#fffefa;--ink:#1d3026;--green:#254936;--muted:#778077;--line:#dce1d9;--gold:#b49b68}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1200px;margin:auto;padding:28px 20px 70px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{font:26px Georgia,serif;letter-spacing:2px}.sub{color:var(--muted);font-size:12px;letter-spacing:2px}.btn{border:0;background:var(--green);color:white;padding:12px 16px;border-radius:7px;cursor:pointer}.btn.alt{background:transparent;color:var(--green);border:1px solid var(--green)}.btn.danger{background:#8b3d34}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin:14px 0;box-shadow:0 5px 22px #253b2e08}.login{max-width:420px;margin:12vh auto}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:6px;background:white;margin:7px 0 14px}.label{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:8px;margin:20px 0}.tab{padding:11px 16px;border:1px solid var(--line);background:transparent;border-radius:7px;color:var(--ink)}.tab.active{background:var(--green);color:white}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat strong{display:block;font-size:26px;margin-top:8px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{color:var(--muted);font-weight:600}.status{display:inline-block;padding:5px 8px;border-radius:20px;background:#eee9d9;font-size:11px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.hidden{display:none!important}.muted{color:var(--muted)}a{color:var(--green)}@media(max-width:650px){.shell{padding:18px 13px 50px}.stats{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.head{align-items:flex-start}.brand{font-size:22px}.card{padding:15px}}
</style></head><body><div class="shell">
<header class="head"><div><div class="brand">PRIMEFIT</div><div class="sub">ADMINISTRATION</div></div><button id="logout" class="btn alt hidden">Chiqish</button></header>
<section id="login" class="card login"><h2>Admin kirish</h2><p class="muted">PrimeFit administrator akkauntingiz bilan kiring.</p><form id="loginForm"><label class="label">EMAIL</label><input class="field" id="email" type="email" required autocomplete="username"><label class="label">PAROL</label><input class="field" id="password" type="password" required autocomplete="current-password"><button class="btn" style="width:100%">Kirish</button></form><p id="loginMsg" class="muted"></p></section>
<main id="app" class="hidden"><div class="stats"><div class="card"><span class="muted">Jami buyurtmalar</span><strong id="totalOrders">—</strong></div><div class="card"><span class="muted">Tekshiruvda</span><strong id="pendingOrders">—</strong></div><div class="card"><span class="muted">Mahsulotlar</span><strong id="totalProducts">—</strong></div></div>
<nav class="tabs"><button class="tab active" data-tab="orders">Buyurtmalar</button><button class="tab" data-tab="products">Mahsulotlar</button></nav>
<section id="ordersPane" class="card"><div class="row"><h2>Buyurtmalar</h2><button id="refreshOrders" class="btn alt">Yangilash</button></div><p id="orderMsg" class="muted"></p><div class="tablewrap"><table><thead><tr><th>Sana</th><th>Mijoz</th><th>Buyurtma</th><th>Summa</th><th>Holat</th><th>Amal</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section>
<section id="productsPane" class="card hidden"><div class="row"><h2>Mahsulotlar</h2><button id="newProduct" class="btn">+ Mahsulot qo‘shish</button></div><form id="productForm" class="hidden"><input id="productId" type="hidden"><div class="formgrid"><div><label class="label">NOMI</label><input id="pName" class="field" required></div><div><label class="label">KATEGORIYA</label><input id="pCategory" class="field" value="Boshqa" required></div><div><label class="label">KOREYA NARXI (₩)</label><input id="pKrw" class="field" type="number" min="0" required></div><div><label class="label">O‘ZBEKISTON NARXI (so‘m)</label><input id="pUzs" class="field" type="number" min="0" required></div><div><label class="label">RASМ URL</label><input id="pImage" class="field" type="url" placeholder="https://..."></div><div><label class="label">O‘LCHAMLAR (vergul bilan)</label><input id="pSizes" class="field" placeholder="S, M, L"></div><div><label class="label">RANGLAR (vergul bilan)</label><input id="pColors" class="field" placeholder="Qora, Oq"></div><div><label class="label">TAVSIF</label><input id="pDescription" class="field"></div></div><label><input id="pActive" type="checkbox" checked> Saytda ko‘rsatish</label><p class="row"><button class="btn">Saqlash</button><button type="button" id="cancelProduct" class="btn alt">Bekor qilish</button></p></form><p id="productMsg" class="muted"></p><div class="tablewrap"><table><thead><tr><th>Mahsulot</th><th>Kategoriya</th><th>Koreya</th><th>O‘zbekiston</th><th>Holat</th><th>Amal</th></tr></thead><tbody id="productsBody"></tbody></table></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://txdhpemtyzivroesohdh.supabase.co","sb_publishable_LasflEZFHekD-gycTX54cA_LJWgsydb");
const $=id=>document.getElementById(id);let session=null,products=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(v,c)=>Number(v||0).toLocaleString("en-US")+(c==="KRW"?" ₩":" so‘m");
function msg(id,s){$(id).textContent=s||""}
async function isAdmin(){const r=await db.rpc("is_admin");if(r.error)throw r.error;return r.data===true}
async function boot(){const r=await db.auth.getSession();session=r.data.session;if(!session){showLogin();return}try{if(!await isAdmin())throw new Error("Bu akkauntda admin huquqi yo‘q.");$("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");await Promise.all([loadOrders(),loadProducts()])}catch(e){await db.auth.signOut();showLogin(e.message)}}
function showLogin(error=""){ $("login").classList.remove("hidden");$("app").classList.add("hidden");$("logout").classList.add("hidden");msg("loginMsg",error)}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();msg("loginMsg","Tekshirilmoqda...");const r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error){msg("loginMsg",r.error.message);return}session=r.data.session;try{if(!await isAdmin())throw new Error("Admin huquqi topilmadi.");$("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");await Promise.all([loadOrders(),loadProducts()])}catch(err){await db.auth.signOut();showLogin(err.message)}});
$("logout").onclick=async()=>{await db.auth.signOut();session=null;showLogin()};
async function loadOrders(){msg("orderMsg","Yuklanmoqda...");const r=await db.from("orders").select("id,created_at,customer_name,phone,address,items,total,currency,status,receipt_path").order("created_at",{ascending:false}).limit(100);if(r.error){msg("orderMsg",r.error.message);return}const rows=r.data||[];$("totalOrders").textContent=rows.length;$("pendingOrders").textContent=rows.filter(x=>["under_review","awaiting_receipt"].includes(x.status)).length;$("ordersBody").innerHTML=rows.map(o=>{const date=new Date(o.created_at).toLocaleString("uz-UZ");const items=Array.isArray(o.items)?o.items.map(i=>esc(i.name||i.title||"Mahsulot")+" × "+esc(i.quantity||1)).join("<br>"):esc(JSON.stringify(o.items));return "<tr><td>"+esc(date)+"</td><td><b>"+esc(o.customer_name)+"</b><br>"+esc(o.phone)+"<br>"+esc(o.address)+"</td><td>"+items+(o.receipt_path?"<br><button class='btn alt receipt' data-path='"+esc(o.receipt_path)+"'>Chekni ko‘rish</button>":"")+"</td><td>"+money(o.total,o.currency)+"</td><td><span class='status'>"+esc(o.status)+"</span></td><td><button class='btn approve' data-id='"+o.id+"' data-status='approved'>Tasdiqlash</button> <button class='btn danger reject' data-id='"+o.id+"' data-status='rejected'>Rad etish</button></td></tr>"}).join("")||"<tr><td colspan='6'>Buyurtmalar yo‘q.</td></tr>";msg("orderMsg","Oxirgi "+rows.length+" ta buyurtma ko‘rsatildi.") }
$("ordersBody").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;if(b.classList.contains("receipt")){const r=await db.storage.from("payment-receipts").createSignedUrl(b.dataset.path,180);if(r.error){alert(r.error.message);return}window.open(r.data.signedUrl,"_blank","noopener");return}if(b.classList.contains("approve")||b.classList.contains("reject")){const status=b.dataset.status;if(!confirm(status==="approved"?"Buyurtmani tasdiqlaysizmi?":"Buyurtmani rad etasizmi?"))return;const r=await db.from("orders").update({status,updated_at:new Date().toISOString()}).eq("id",b.dataset.id);if(r.error){alert(r.error.message);return}await loadOrders()}});
async function loadProducts(){const r=await db.from("products").select("*").order("created_at",{ascending:false});if(r.error){msg("productMsg",r.error.message);return}products=r.data||[];$("totalProducts").textContent=products.length;$("productsBody").innerHTML=products.map(p=>"<tr><td><b>"+esc(p.name)+"</b><br><small>"+esc(p.description)+"</small></td><td>"+esc(p.category)+"</td><td>"+money(p.price_krw,"KRW")+"</td><td>"+money(p.price_uzs,"UZS")+"</td><td>"+(p.is_active?"Faol":"Yashirin")+"</td><td><button class='btn alt edit' data-id='"+p.id+"'>Tahrirlash</button> <button class='btn danger delete' data-id='"+p.id+"'>O‘chirish</button></td></tr>").join("")||"<tr><td colspan='6'>Hozircha mahsulot yo‘q.</td></tr>";msg("productMsg",products.length+" ta mahsulot")}
function resetProduct(){$("productForm").reset();$("productId").value="";$("pCategory").value="Boshqa";$("pActive").checked=true;$("productForm").classList.add("hidden")}
$("newProduct").onclick=()=>{$("productForm").classList.remove("hidden");$("productId").value="";$("productForm").reset();$("pCategory").value="Boshqa";$("pActive").checked=true};
$("cancelProduct").onclick=resetProduct;
$("productsBody").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;const p=products.find(x=>x.id===b.dataset.id);if(b.classList.contains("edit")&&p){$("productId").value=p.id;$("pName").value=p.name;$("pCategory").value=p.category;$("pKrw").value=p.price_krw;$("pUzs").value=p.price_uzs;$("pImage").value=p.image_url||"";$("pSizes").value=(p.sizes||[]).join(", ");$("pColors").value=(p.colors||[]).join(", ");$("pDescription").value=p.description||"";$("pActive").checked=p.is_active;$("productForm").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})}if(b.classList.contains("delete")&&p&&confirm("Mahsulotni o‘chirasizmi?")){const r=await db.from("products").delete().eq("id",p.id);if(r.error){msg("productMsg",r.error.message);return}await loadProducts()}});
$("productForm").addEventListener("submit",async e=>{e.preventDefault();const id=$("productId").value;const data={name:$("pName").value.trim(),category:$("pCategory").value.trim(),price_krw:Number($("pKrw").value),price_uzs:Number($("pUzs").value),image_url:$("pImage").value.trim(),sizes:$("pSizes").value.split(",").map(x=>x.trim()).filter(Boolean),colors:$("pColors").value.split(",").map(x=>x.trim()).filter(Boolean),description:$("pDescription").value.trim(),is_active:$("pActive").checked,updated_at:new Date().toISOString()};const r=id?await db.from("products").update(data).eq("id",id):await db.from("products").insert(data);if(r.error){msg("productMsg",r.error.message);return}msg("productMsg","Saqlandi.");resetProduct();await loadProducts()});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));$("ordersPane").classList.toggle("hidden",b.dataset.tab!=="orders");$("productsPane").classList.toggle("hidden",b.dataset.tab!=="products")});
$("refreshOrders").onclick=loadOrders;boot();
</script></body></html>
